<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tap 1 to 10 and every number that ends the same way lights up, all the way to 110.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fdf8f0">
  <title>Number Pattern Lights</title>
  <link rel="stylesheet" href="../../../../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tool">
  <header class="tool-header">
    <a class="icon-btn" href="../../../../index.html" aria-label="All tools" title="All tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Number Pattern Lights</h1>
    <div class="tool-actions">
      <button class="icon-btn mute-btn" id="mute" type="button" hidden>
        <svg class="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
        <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
      </button>
      <button class="pill-btn" id="reset" type="button" aria-label="Reset" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="btn-label">Reset</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="unit">
      <div class="board" id="board" aria-hidden="true">
        <div class="goal-zone"></div>
      </div>
      <nav class="pad" id="pad" aria-label="Number buttons"></nav>
      <div class="banner" id="banner" role="status" hidden>
        <span class="banner-star" aria-hidden="true">★</span>
        Great counting!
        <span class="banner-star" aria-hidden="true">★</span>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

  <script src="../../../../shared/speech.js"></script>
  <script src="app.js"></script>
</body>
</html>
