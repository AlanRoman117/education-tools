<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Small hands-on learning tools, sorted by subject, topic and age.">
  <meta name="theme-color" content="#fdf8f0">
  <title>Education Tools</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .rainbow {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .rainbow span {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--c);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      margin: 28px 0 8px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .filter-label {
      margin-right: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .age select {
      min-height: 44px;
      padding: 0 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-weight: 700;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .chip {
      min-height: 40px;
      padding: 0 16px;
      border: 2px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      font-weight: 700;
      cursor: pointer;
    }

    .chip[aria-pressed="true"] {
      border-color: var(--text);
      background: var(--text);
      color: var(--bg);
    }

    .subject {
      margin-top: 36px;
    }

    .subject h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 4px;
      font-size: 1.6rem;
      font-weight: 900;
    }

    .subject h2::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 5px;
      background: var(--subject);
    }

    .topic h3 {
      margin: 18px 0 12px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      border: 1px solid var(--border);
      border-top: 6px solid var(--subject);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card h4 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 6px;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .tag.ages {
      background: var(--text);
      color: var(--surface);
    }

    .empty {
      margin-top: 36px;
      padding: 32px 16px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    .footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="rainbow" aria-hidden="true">
        <span data-digit="1"></span><span data-digit="2"></span><span data-digit="3"></span><span data-digit="4"></span><span data-digit="5"></span><span data-digit="6"></span><span data-digit="7"></span><span data-digit="8"></span><span data-digit="9"></span><span data-digit="10"></span>
      </div>
      <h1>Education Tools</h1>
      <p>Small hands-on tools for learning, one page each.</p>
    </header>

    <section class="filters" aria-label="Filters">
      <label class="age">
        <span class="filter-label">Age</span>
        <select id="age"></select>
      </label>
      <div class="chips" id="subjects" role="group" aria-label="Subject"></div>
    </section>

    <main id="results"></main>

    <p class="footer" id="footer"></p>
  </div>

  <script src="catalog.js"></script>
  <script>
    (function () {
      'use strict';

      var AGE_KEY = 'eduTools.home.age';
      var subjects = window.EduTools.subjects;
      var tools = window.EduTools.catalog;
      var ageSelect = document.getElementById('age');
      var chips = document.getElementById('subjects');
      var results = document.getElementById('results');
      var footer = document.getElementById('footer');
      var state = { age: '', subject: '' };

      try {
        state.age = window.localStorage.getItem(AGE_KEY) || '';
      } catch (e) {
        // Storage blocked; start with "Any age".
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      // "place-value" -> "Place value"
      function topicTitle(slug) {
        var words = slug.replace(/-/g, ' ');
        return words.charAt(0).toUpperCase() + words.slice(1);
      }

      function subjectById(id) {
        return subjects.filter(function (s) { return s.id === id; })[0] ||
          { id: id, title: topicTitle(id), color: 'var(--accent)' };
      }

      function matches(tool) {
        if (state.subject && tool.subject !== state.subject) return false;
        if (state.age) {
          var age = Number(state.age);
          if (age < tool.ages[0] || age > tool.ages[1]) return false;
        }
        return true;
      }

      function buildAgeSelect() {
        var any = el('option', null, 'Any age');
        any.value = '';
        ageSelect.appendChild(any);
        for (var age = 2; age <= 18; age++) {
          var option = el('option', null, String(age));
          option.value = String(age);
          ageSelect.appendChild(option);
        }
        ageSelect.value = state.age;
        if (ageSelect.value !== state.age) state.age = '';
        ageSelect.addEventListener('change', function () {
          state.age = ageSelect.value;
          try {
            window.localStorage.setItem(AGE_KEY, state.age);
          } catch (e) {
            // Not remembered; filter still works.
          }
          render();
        });
      }

      function buildChips() {
        var used = subjects.filter(function (s) {
          return tools.some(function (t) { return t.subject === s.id; });
        });
        [{ id: '', title: 'All' }].concat(used).forEach(function (subject) {
          var chip = el('button', 'chip', subject.title);
          chip.type = 'button';
          chip.dataset.subject = subject.id;
          chip.addEventListener('click', function () {
            state.subject = subject.id;
            render();
          });
          chips.appendChild(chip);
        });
      }

      function card(tool, subject) {
        var link = el('a', 'card');
        link.href = tool.path;
        link.style.setProperty('--subject', subject.color);
        link.appendChild(el('h4', null, tool.title));
        link.appendChild(el('p', null, tool.description));
        var meta = el('div', 'card-meta');
        meta.appendChild(el('span', 'tag ages', 'Ages ' + tool.ages[0] + '–' + tool.ages[1]));
        (tool.skills || []).forEach(function (skill) {
          meta.appendChild(el('span', 'tag', skill));
        });
        link.appendChild(meta);
        return link;
      }

      function render() {
        chips.querySelectorAll('.chip').forEach(function (chip) {
          chip.setAttribute('aria-pressed', chip.dataset.subject === state.subject ? 'true' : 'false');
        });

        results.textContent = '';
        var shown = tools.filter(matches);

        // Subjects in catalog order, then any a tool uses that isn't listed.
        var subjectIds = subjects.map(function (s) { return s.id; });
        shown.forEach(function (t) {
          if (subjectIds.indexOf(t.subject) === -1) subjectIds.push(t.subject);
        });

        subjectIds.map(subjectById).forEach(function (subject) {
          var inSubject = shown.filter(function (t) { return t.subject === subject.id; });
          if (!inSubject.length) return;

          var section = el('section', 'subject');
          section.style.setProperty('--subject', subject.color);
          section.appendChild(el('h2', null, subject.title));

          var topics = [];
          inSubject.forEach(function (t) {
            if (topics.indexOf(t.topic) === -1) topics.push(t.topic);
          });
          topics.sort().forEach(function (topic) {
            var group = el('div', 'topic');
            group.appendChild(el('h3', null, topicTitle(topic)));
            var grid = el('div', 'cards');
            inSubject
              .filter(function (t) { return t.topic === topic; })
              .sort(function (a, b) { return a.title.localeCompare(b.title); })
              .forEach(function (t) { grid.appendChild(card(t, subject)); });
            group.appendChild(grid);
            section.appendChild(group);
          });

          results.appendChild(section);
        });

        if (!shown.length) {
          var where = state.subject ? ' in ' + subjectById(state.subject).title : '';
          var who = state.age ? ' for age ' + state.age : '';
          results.appendChild(el('p', 'empty', 'No tools' + who + where + ' yet.'));
        }

        footer.textContent = shown.length + ' of ' + tools.length +
          (tools.length === 1 ? ' tool' : ' tools') + ' shown.';
      }

      buildAgeSelect();
      buildChips();
      render();
    })();
  </script>
</body>
</html>
